<section class="screen">
  <h1>Du var mest lik {{ quiz.winnerName() }}!</h1>

  <div class="bars" aria-label="Resultat">
    <div class="bar-row">
      <div class="bar-meta">
        <span>Simon</span>
        <span>{{ quiz.simonPercent() }}%</span>
      </div>
      <div class="track">
        <div class="fill" [style.width.%]="quiz.simonPercent()"></div>
      </div>
    </div>

    <div class="bar-row">
      <div class="bar-meta">
        <span>Nora</span>
        <span>{{ quiz.noraPercent() }}%</span>
      </div>
      <div class="track">
        <div class="fill" [style.width.%]="quiz.noraPercent()"></div>
      </div>
    </div>
  </div>
</section>
